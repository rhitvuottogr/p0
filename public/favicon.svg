<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Blue app tile -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="#0b61f7"></rect>

  <!-- Outer pin/radar -->
